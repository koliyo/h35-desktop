[project]
name = "h35-ops"
version = "0.1.0"
description = "CI and maintainer commands for the h35-desktop repository."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
h35-ops = "h35_ops.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/h35_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8"]
