[package]
name = "h35-desktop"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
description = "Native host for hypermedia-driven desktop apps: windows, webviews, and preview chrome"
repository = "https://github.com/koliyo/h35-desktop"
homepage = "https://github.com/koliyo/h35-desktop"

[dependencies]
muda = { version = "0.19.2", default-features = false, features = ["gtk"] }
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tao = "0.36"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
url = "2.5"
uuid = { version = "1.18", features = ["v4", "js"] }
wry = { version = "0.56", features = ["devtools"] }
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSButton",
    "NSDockTile",
    "NSEvent",
    "NSImage",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSData",
] }
